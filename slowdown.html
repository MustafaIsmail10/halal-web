<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Loading…</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
        }

        /* A gray ring with one darker side, turning forever */
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #ddd;
            border-top-color: #555;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="spinner" role="status" aria-label="Loading"></div>
    <script src="scripts/slowdown.js"></script>
</body>

</html>
